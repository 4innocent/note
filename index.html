<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.13/vue.global.prod.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.40.0/minified.min.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>{{ message }}</h1>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      setup() {
        const message = Vue.ref("Hello Vue 3");
        return { message };
      },
    });
    app.mount("#app");
  </script>
</html>
